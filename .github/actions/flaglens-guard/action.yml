name: FlagLens Guard
description: Audit Flagsmith environments, scan source code and enforce release policies.

inputs:
  project-id:
    description: Flagsmith project ID
    required: false
    default: "1"

  flagsmith-base-url:
    description: Self-hosted Flagsmith base URL
    required: false
    default: "http://localhost:8000"

  flagsmith-api-key:
    description: Flagsmith organisation Management API token
    required: true

  development-environment-key:
    description: Development client-side environment key
    required: true

  production-environment-key:
    description: Production client-side environment key
    required: true

  scan-path:
    description: Repository directory to scan, relative to workspace
    required: false
    default: "."

  policy-path:
    description: Policy JSON path, relative to workspace
    required: false
    default: "flaglens.policy.json"

  fail-on-unknown:
    description: Fail when source references unknown feature flags
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install FlagLens CLI dependencies
      shell: powershell
      run: |
        $cliPath = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_ACTION_PATH "../../../cli"))

        if (!(Test-Path (Join-Path $cliPath "package-lock.json"))) {
          throw "FlagLens CLI package-lock.json was not found."
        }

        npm ci --prefix $cliPath

        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    - name: Validate release guard prerequisites
      shell: powershell
      env:
        FLAGSMITH_BASE_URL: ${{ inputs.flagsmith-base-url }}
        FLAGSMITH_API_KEY: ${{ inputs.flagsmith-api-key }}
        FLAGSMITH_DEVELOPMENT_ENV_KEY: ${{ inputs.development-environment-key }}
        FLAGSMITH_PRODUCTION_ENV_KEY: ${{ inputs.production-environment-key }}
      run: |
        $required = @(
          @{ Name = "FLAGSMITH_API_KEY"; Value = $env:FLAGSMITH_API_KEY },
          @{ Name = "FLAGSMITH_DEVELOPMENT_ENV_KEY"; Value = $env:FLAGSMITH_DEVELOPMENT_ENV_KEY },
          @{ Name = "FLAGSMITH_PRODUCTION_ENV_KEY"; Value = $env:FLAGSMITH_PRODUCTION_ENV_KEY }
        )
        foreach ($item in $required) {
          if ([string]::IsNullOrWhiteSpace($item.Value)) {
            throw "Required GitHub secret/input is missing: $($item.Name)"
          }
        }

        $uri = [System.Uri]$env:FLAGSMITH_BASE_URL
        $port = if ($uri.IsDefaultPort) { 80 } else { $uri.Port }
        $connection = Test-NetConnection -ComputerName $uri.Host -Port $port -WarningAction SilentlyContinue
        if (!$connection.TcpTestSucceeded) {
          throw "Cannot reach Flagsmith at $($uri.Host):$port from this runner. Confirm the instance is running and reachable."
        }
        Write-Host "Required inputs are present and the Flagsmith TCP endpoint is reachable."

    - name: Generate unified release governance report
      shell: powershell
      env:
        FLAGSMITH_BASE_URL: ${{ inputs.flagsmith-base-url }}
        FLAGSMITH_API_KEY: ${{ inputs.flagsmith-api-key }}
        FLAGSMITH_DEVELOPMENT_ENV_KEY: ${{ inputs.development-environment-key }}
        FLAGSMITH_PRODUCTION_ENV_KEY: ${{ inputs.production-environment-key }}
        FLAGLENS_PROJECT_ID: ${{ inputs.project-id }}
        FLAGLENS_POLICY_PATH: ${{ inputs.policy-path }}
        FLAGLENS_SCAN_PATH: ${{ inputs.scan-path }}
        FLAGLENS_FAIL_ON_UNKNOWN: ${{ inputs.fail-on-unknown }}
      run: |
        $cliPath = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_ACTION_PATH "../../../cli"))
        $entry = Join-Path $cliPath "src/index.js"

        $scanPath = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE $env:FLAGLENS_SCAN_PATH))
        $policyPath = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE $env:FLAGLENS_POLICY_PATH))

        $env:FLAGLENS_POLICY_PATH = $policyPath

        if ($env:FLAGLENS_FAIL_ON_UNKNOWN -notin @("true", "false")) {
          throw "The fail-on-unknown input must be true or false."
        }

        $arguments = @(
          $entry,
          "--project", $env:FLAGLENS_PROJECT_ID,
          "report",
          "--format", "both",
          "--scan-path", $scanPath,
          "--output-dir", $env:GITHUB_WORKSPACE
        )

        if ($env:FLAGLENS_FAIL_ON_UNKNOWN -ieq "true") {
          $arguments += "--strict"
        }

        Write-Host "Generating JSON and Markdown release evidence..."
        node @arguments
        $reportExitCode = $LASTEXITCODE

        if ($reportExitCode -ne 0) {
          Write-Host "FlagLens blocked the release. Audit artifacts were generated before enforcement."
          exit $reportExitCode
        }

        Write-Host "FlagLens approved the release. Audit artifacts were generated."
