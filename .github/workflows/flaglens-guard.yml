name: FlagLens Release Guard

on:
  workflow_dispatch:
    inputs:
      scan_path:
        description: Select the clean approval fixture or negative blocking fixture.
        required: true
        type: choice
        options:
          - examples/clean-app
          - examples/negative-app
        default: examples/clean-app

permissions:
  contents: read

jobs:
  release-guard:
    name: FlagLens Release Governance
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Configure Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Run FlagLens Guard
        uses: ./.github/actions/flaglens-guard
        with:
          project-id: "1"
          flagsmith-base-url: "http://127.0.0.1:8000"
          flagsmith-api-key: ${{ secrets.FLAGSMITH_API_KEY }}
          development-environment-key: ${{ secrets.FLAGSMITH_DEVELOPMENT_ENV_KEY }}
          production-environment-key: ${{ secrets.FLAGSMITH_PRODUCTION_ENV_KEY }}
          scan-path: ${{ inputs.scan_path }}
          policy-path: "flaglens.policy.json"
          fail-on-unknown: "true"

      - name: Upload FlagLens audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaglens-audit-${{ github.run_id }}
          path: |
            flaglens-report.json
            flaglens-report.md
          if-no-files-found: warn
          retention-days: 14
